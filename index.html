<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>Rifay Umami</title>
  <meta name="description" content="Rifay Umami — книга с рецепти">
  <meta name="theme-color" content="#F6F3EE" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0D0D0F" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rifay Umami">
  <meta name="application-name" content="Rifay Umami">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" type="image/svg+xml" href="icons/logo.svg">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply theme + text size before first paint to avoid a flash.
    try {
      var s = JSON.parse(localStorage.getItem('chocho.settings') || '{}');
      if (s.theme && s.theme !== 'auto') document.documentElement.dataset.theme = s.theme;
      if (s.scale) document.documentElement.style.setProperty('--scale', s.scale);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <main id="tabs-root"></main>
    <div id="pages-root"></div>
    <nav class="tabbar" id="tabbar" aria-label="Main">
      <button class="tab" data-tab="home" aria-label="Recipes">
        <svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5.5v-6h-5v6H4a1 1 0 0 1-1-1z"/></svg>
        <span data-i18n="tab_home"></span>
      </button>
      <button class="tab" data-tab="categories" aria-label="Categories">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="2"/><rect x="13.5" y="3.5" width="7" height="7" rx="2"/><rect x="3.5" y="13.5" width="7" height="7" rx="2"/><rect x="13.5" y="13.5" width="7" height="7" rx="2"/></svg>
        <span data-i18n="tab_categories"></span>
      </button>
      <button class="tab tab-add" data-action="new-recipe" aria-label="Add recipe">
        <span class="plus"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></span>
      </button>
      <button class="tab" data-tab="favorites" aria-label="Favorites">
        <svg viewBox="0 0 24 24"><path d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 7.9 3.6 4.5 7 4.5c2 0 3.6 1.1 5 3 1.4-1.9 3-3 5-3 3.4 0 5.6 3.4 4.3 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>
        <span data-i18n="tab_favorites"></span>
      </button>
      <button class="tab hidden" data-tab="chat" aria-label="Chat">
        <span class="tab-ico"><svg viewBox="0 0 24 24"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1h-9l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/></svg><i id="chat-badge" class="tab-badge hidden"></i></span>
        <span data-i18n="tab_chat"></span>
      </button>
      <button class="tab" data-tab="settings" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span data-i18n="tab_settings"></span>
      </button>
    </nav>
    <div id="sheet-root"></div>
    <div id="auth-root"></div>
    <div id="alarm-root"></div>
    <button id="chat-toast" class="chat-toast" aria-live="polite"></button>
    <button id="timer-pill" class="timer-pill hidden" data-timer="pill" aria-label="Timer"></button>
    <div id="toast" role="status" aria-live="polite"></div>
  </div>
  <input type="file" id="file-camera" accept="image/*" capture="environment" hidden>
  <input type="file" id="file-gallery" accept="image/*" multiple hidden>
  <input type="file" id="file-import" accept="application/json,.json" hidden>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="config.js"></script>
  <script src="cloud.js"></script>
  <script src="smartparse.js"></script>
  <script src="chat.js"></script>
  <script src="invite.js"></script>
  <script src="admin.js"></script>
  <script src="app.js"></script>
</body>
</html>
